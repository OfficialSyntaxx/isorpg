<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1220" />
  <title>Isoperia — 2.5D Isometric RPG &amp; Settlement Builder</title>
  <!-- Inline SVG favicon: without one, every page load logs a 404 for
       /favicon.ico, which the boot smoke test then has to filter out. A data URI
       costs no request. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M16 5l10 6-10 6-10-6z' fill='%236aa8ff'/%3E%3Cpath d='M6 13l10 6 10-6v6l-10 6-10-6z' fill='%237cd992'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <div id="game-canvas"></div>
    <div id="ui-root">
      <header id="topbar" class="hud-slot safe-top">
        <div id="player-chip" class="chip">
          <div class="chip-label">Lv</div>
          <div id="player-level" class="chip-value">1</div>
          <div id="player-name" class="chip-name">Hero</div>
        </div>
        <div id="player-hp" class="hpbar">
          <div class="hpbar-core"><span id="player-hp-text">10/10</span><div class="hpbar-fill-wrap"><div id="player-hp-fill"></div></div></div>
        </div>
        <div id="action-xp" class="chip action-chip hidden">
          <div id="action-xp-label">Woodcutting</div>
          <div class="xp-track"><div id="action-xp-fill"></div></div>
        </div>
        <div id="day-chip" class="chip">
          <span id="day-icon">☀️</span><span id="day-label">Day 1</span>
        </div>
      </header>

      <div id="toast-root"></div>
      <div id="float-layer"></div>
      <div id="night-overlay"></div>
      <div id="target-chip" class="target-chip hidden"></div>

      <div id="combat-tray" class="hud-slot combat-tray hidden">
        <div class="combat-name" id="combat-name">Goblin</div>
        <div class="combat-hp"><div id="combat-hp-fill"></div><span id="combat-hp-text">14/14</span></div>
      </div>

      <div id="place-banner" class="hud-slot place-banner hidden">
        <span id="place-banner-text">Tap a green tile to build</span>
        <button id="place-cancel" class="btn-mini">Cancel</button>
      </div>

      <nav id="bottom-bar" class="hud-slot safe-bottom">
        <button id="btn-combat" class="bar-btn" data-panel="combat" aria-label="Combat">
          <span class="bar-ico">⚔️</span><span class="bar-caption">Combat</span>
        </button>
        <button id="btn-craft" class="bar-btn" data-panel="craft" aria-label="Craft">
          <span class="bar-ico">🔨</span><span class="bar-caption">Craft</span>
        </button>
        <button id="btn-build" class="bar-btn" data-panel="build" aria-label="Build">
          <span class="bar-ico">🏗️</span><span class="bar-caption">Build</span>
        </button>
        <button id="btn-inventory" class="bar-btn" data-panel="inventory" aria-label="Inventory">
          <span class="bar-ico">🎒</span><span class="bar-caption">Bag</span>
        </button>
        <button id="btn-map" class="bar-btn" data-panel="map" aria-label="World Map">
          <span class="bar-ico">🗺️</span><span class="bar-caption">Map</span>
        </button>
        <button id="btn-quest" class="bar-btn" data-panel="quest" aria-label="Quests">
          <span class="bar-ico">📖</span><span class="bar-caption">Quests</span>
        </button>
        <button id="btn-progress" class="bar-btn" data-panel="meta" aria-label="Progress">
          <span class="bar-ico">🏆</span><span class="bar-caption">Progress</span>
        </button>
        <button id="btn-village" class="bar-btn" data-panel="village" aria-label="Village">
          <span class="bar-ico">🏡</span><span class="bar-caption">Village</span>
        </button>
        <button id="btn-settings" class="bar-btn" data-panel="settings" aria-label="Settings">
          <span class="bar-ico">⚙️</span><span class="bar-caption">Menu</span>
        </button>
      </nav>

      <aside id="side-panel" class="hud-slot panel hidden">
        <div class="panel-head">
          <h2 id="panel-title">Inventory</h2>
          <button id="panel-close" class="panel-close" aria-label="Close">✕</button>
        </div>
        <div id="panel-body" class="panel-body"></div>
      </aside>

      <div id="modal-root"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
