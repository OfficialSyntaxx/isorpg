name: Unity WebGL

# Builds the Unity project and deploys it to Netlify, so shipping a change no
# longer requires a human with the Editor open.
#
# WHY THIS EXISTS, AND WHY IT IS NOT NETLIFY'S OWN GIT DEPLOY:
# Netlify builds in its own image, which has no Unity and no licence, so it
# cannot produce the artifact. The build has to happen here; Netlify is a dumb
# host receiving a finished directory.
#
# WHAT THIS IS FIXING:
# Four separate faults reached a real phone during Phase 1 — the camera framing
# the map's corner, the service worker serving its first build forever, URP
# installed but never assigned, and shared materials orphaning each other's
# references. Every one passed the build, the deploy AND the header checks. The
# round trip to find each was a human running six manual steps and reporting
# back. That loop is what this replaces.
on:
  push:
    branches: [main]
    paths:
      - "unity/**"
      - ".github/workflows/unity-webgl.yml"
      - "scripts/deploy-report.sh"
      # Not the reports themselves — they are written BY this workflow, and
      # including them would make every run trigger the next one.
      - "!unity/build-report.txt"
      - "!unity/deploy-report.txt"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Netlify after building"
        type: boolean
        default: true

concurrency:
  group: unity-webgl
  # Never cancel: a half-cancelled Unity build leaves a corrupt Library cache,
  # and a cancelled deploy can leave the site on a partial upload.
  cancel-in-progress: false

jobs:
  # Everything that can be checked without Unity, checked first. This job takes
  # seconds and needs no licence, so a broken scene fails in under a minute
  # rather than after a 20-minute build.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The magenta gate. Reads the scene FILE, so no Editor is involved.
      - name: Scene materials
        run: node scripts/verify-scene-materials.cjs

      # The PWA shell and the ported simulation core. Isoperia.Core is declared
      # noEngineReferences, which is what lets its 167 assertions run here with
      # no Unity at all.
      - name: PWA template
        run: npm run verify:pwa
      - name: Core, parity, JSON, sanitizer
        run: |
          npm run verify:core
          npm run verify:parity
          npm run verify:json
          npm run verify:sanitizer
          npm run verify:content
          npm run verify:world
          npm run verify:shaders
          npm run verify:models
          npm run verify:separators

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Library/ is not version-controlled and reimporting from cold costs most
      # of the build time. Keyed on the things whose change actually invalidates
      # an import.
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-WebGL-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # Unity's own build step. ConfigureWebGL runs first inside BuildWebGL, so
      # the pipeline, compression, stripping and heap settings are applied here
      # rather than depending on whatever a working copy happened to have.
      #
      # BuildWebGL throws BuildFailedException on a renderer with no material or
      # a material whose shader disagrees with the active pipeline. Those are
      # meant to fail the run. Do not add continue-on-error.
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: 6000.5.8f1
          targetPlatform: WebGL
          buildMethod: Isoperia.EditorTools.IsoperiaBuild.BuildWebGL
          allowDirtyBuild: true

      # The container writes as root; the later steps do not run as root.
      - name: Fix artifact ownership
        run: sudo chown -R $USER:$USER unity/WebGLBuild unity/build-report.txt || true

      - name: Build report
        run: cat unity/build-report.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: WebGLBuild
          path: unity/WebGLBuild
          # Raised from 14. The website deploy lane reuses this artifact rather
          # than rebuilding Unity, so at 14 days a landing-copy change more than
          # a fortnight after the last game build would have nothing to compose
          # against and would (correctly) refuse to deploy.
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || inputs.deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: WebGLBuild
          path: unity/WebGLBuild

      # Reuses the same script a human runs locally, so there is one deploy
      # path rather than two that can drift. It deploys, then re-fetches the
      # wasm and the data file and checks Content-Type and Content-Encoding —
      # the single thing separating "deployed" from "actually loads".
      # The site root is the landing page and the game lives at /play, so every
      # deploy must publish the FULL composed tree. Netlify's --dir deploy
      # replaces the whole site: publishing only the Unity build here would
      # delete the website.
      - name: Build the landing site
        working-directory: web
        run: |
          npm ci
          npm run build

      # Refuses to compose without the game, so a broken artifact cannot become
      # a deploy that silently drops /play.
      - name: Compose the publish directory
        run: |
          node scripts/compose-site.cjs \
            --site web/dist \
            --game unity/WebGLBuild \
            --out dist-site \
            --prefix play

      - name: Deploy and verify headers
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_DIR: dist-site
          GAME_DIR: unity/WebGLBuild
          GAME_PREFIX: play
        run: scripts/deploy-report.sh

      # Headers being right is not the same as the game starting. This is the
      # check that caught the CSP blocking Unity's inline loader.
      - name: Verify the deployed game boots
        run: |
          SITE=$(grep -m1 '^url: ' unity/deploy-report.txt | cut -d' ' -f2)
          npx --yes playwright@1.62.1 install --with-deps chromium
          node scripts/verify-deployed-play.cjs "$SITE"

      - name: Deploy report
        run: cat unity/deploy-report.txt >> "$GITHUB_STEP_SUMMARY"

      # The header check writes VERDICT lines rather than exiting non-zero, so
      # that a failed check still produces a readable report. Turn it into a
      # build failure here — a deploy serving the wasm as text/plain is a dead
      # site, and it should not be reported as a green run.
      - name: Fail on a bad header verdict
        run: |
          if grep -q 'VERDICT: FAIL' unity/deploy-report.txt; then
            echo "::error::Deployed assets have wrong Content-Type or Content-Encoding — the loader will hang."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: deploy-report
          path: unity/deploy-report.txt
