name: Lighthouse

# Runs Google Lighthouse against the deployed site and reports the scores.
#
# WHY THIS IS A WORKFLOW RATHER THAN SOMETHING RUN LOCALLY
# The Phase 4 exit gate in docs/WEBSITE_BLUEPRINT.md is a Lighthouse score, and
# it stayed open through the whole build because the development environment
# cannot produce an honest one: no Chrome UI, and a network policy that blocks
# Google Fonts — which the real page requests. A score measured there describes
# a page nobody is served. A runner has a real Chrome and open egress.
#
# It is manual by default because it audits whatever is deployed, and because a
# performance score is a measurement of a machine as much as of a page: running
# it on every push would produce a stream of numbers that move on their own.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site to audit. Blank = production."
        required: false
        default: ""
      routes:
        description: "Comma-separated routes to audit."
        required: false
        default: "/,/features/,/wiki/,/devlog/"
      form_factor:
        description: "Which device profile to emulate."
        required: false
        default: "both"
        type: choice
        options: ["both", "mobile", "desktop"]
      runs:
        description: "Runs per page; the median is reported. 3 is the useful minimum."
        required: false
        default: "3"
      enforce:
        description: "Fail the run when a score is below target."
        required: false
        default: true
        type: boolean

concurrency:
  group: lighthouse
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # The runner needs the root's dependencies: run-lighthouse.cjs resolves
      # the browser through scripts/lib/browser.cjs, which imports
      # playwright-core from here.
      - run: npm ci

      # Installed with the SAME Playwright version as playwright-core, so the
      # resolver and the installer agree on where the browser lives.
      - name: Install the browser
        run: |
          PW=$(node -p "require('./node_modules/playwright-core/package.json').version")
          npx --yes "playwright@$PW" install --with-deps chromium

      - name: Run Lighthouse
        run: |
          URL='${{ inputs.url }}'
          if [ -z "$URL" ]; then
            URL=$(node -p "require('./web/site.config.json').origin.canonical || require('./web/site.config.json').origin.current")
          fi
          echo "auditing $URL"
          node scripts/run-lighthouse.cjs \
            --url "$URL" \
            --routes '${{ inputs.routes }}' \
            --form-factor '${{ inputs.form_factor }}' \
            --runs '${{ inputs.runs }}' \
            ${{ inputs.enforce && ' ' || '--no-enforce' }}

      # Always uploaded: a failing run is exactly when the full report matters,
      # because the score says what is wrong and the report says where.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 30
