name: Deploy the website (production)

# Publishes the composed site — landing page at the root, Unity build at /play —
# to production.
#
# WHY THIS LANE EXISTS SEPARATELY FROM unity-webgl.yml
# A copy change on the landing page should not require a 10-30 minute Unity
# build on a licensed runner. This lane rebuilds only the website and reuses the
# most recent successful Unity artifact.
#
# WHY IT STILL PUBLISHES THE WHOLE TREE
# Netlify's --dir deploy replaces the entire site. Publishing only web/dist here
# would delete /play and take the game offline. compose-site.cjs refuses to
# compose without the game, so that failure mode is a stopped workflow rather
# than a silent outage.
#
# THE FIRST RUN IS THE CUTOVER. Until it runs, production serves the game at the
# site root, as it has all along. That is why the production path is manual and
# guarded by a typed confirmation rather than firing on a push.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CUTOVER to publish to production. Anything else runs a draft."
        required: true
        default: "draft"
        type: string
      unity_run_id:
        description: "Run ID of a successful 'Unity WebGL' run. Blank = most recent successful."
        required: false
        type: string

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Everything that can fail without touching the site, first.
      - name: Verify composition, tokens and CSP logic
        run: npm run verify:site

      - name: Resolve the Unity build artifact
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ inputs.unity_run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow unity-webgl.yml --status success \
                       --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful Unity WebGL run found."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download the Unity build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p unity/WebGLBuild
          gh run download "${{ steps.resolve.outputs.run_id }}" \
            --name WebGLBuild --dir unity/WebGLBuild
          test -f unity/WebGLBuild/index.html \
            || { echo "::error::Artifact did not contain index.html"; exit 1; }

      - name: Build the landing site
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Compose the publish directory
        run: |
          node scripts/compose-site.cjs \
            --site web/dist \
            --game unity/WebGLBuild \
            --out dist-site \
            --prefix play

      # Records what production was serving before this run, so a rollback does
      # not depend on anyone having written the id down.
      - name: Record the current production deploy for rollback
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          {
            echo "### Rollback point"
            echo
            echo "If this deploy goes wrong, republish the deploy that was live"
            echo "immediately before it from the Netlify deploys list:"
            echo
            echo "<https://app.netlify.com/projects/inspiring-tarsier-8973d6/deploys>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy and verify headers
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # The typed confirmation is the only thing that reaches production.
          DEPLOY_PROD: ${{ inputs.confirm == 'CUTOVER' && '1' || '0' }}
          DEPLOY_DIR: dist-site
          GAME_DIR: unity/WebGLBuild
          GAME_PREFIX: play
          REPORT: web-deploy-report.txt
        run: scripts/deploy-report.sh

      # Same reason as in site-preview.yml: the deploy log is followed by a
      # browser download, so the one line anybody actually wants gets buried.
      - name: Publish the deployed URL
        run: |
          SITE=$(grep -m1 '^url: ' web-deploy-report.txt | cut -d' ' -f2)
          echo "::notice title=Deployed URL::$SITE"
          {
            echo "## Deployed"
            echo
            echo "<$SITE>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        run: cat web-deploy-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on a bad header verdict
        run: |
          if grep -q 'VERDICT: FAIL' web-deploy-report.txt; then
            echo "::error::Deployed assets have wrong headers — the loader will hang."
            exit 1
          fi

      # The check that caught the CSP blocking Unity's inline loader. Runs
      # against whatever URL was just published, draft or production.
      - name: Verify the deployed game boots
        run: |
          SITE=$(grep -m1 '^url: ' web-deploy-report.txt | cut -d' ' -f2)
          npx --yes playwright@1.62.1 install --with-deps chromium
          PLAY_SCREENSHOT=play-under-csp.png node scripts/verify-deployed-play.cjs "$SITE"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-deploy-report
          path: |
            web-deploy-report.txt
            play-under-csp.png
