name: CI

# Build, test and boot the game on every push and PR.
#
# The smoke test needs a real browser: it loads the built bundle, watches for
# page errors and failed asset requests, and screenshots the canvas to confirm
# something was actually drawn. Two of this project's worst regressions — a boot
# crash from a use-before-assign, and a skinned-clone bug that scaled every actor
# 75x — were invisible to unit tests and obvious the moment a browser ran the
# page. So Chromium is installed rather than letting smoke.cjs skip itself.
on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chromium only — the smoke test and the visual-regression harness are the
      # only browser consumers, and neither is cross-browser.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # tsc --noEmit + vite build. Also regenerates the model manifest, so a
      # manifest committed out of step with public/models fails here.
      - name: Build
        run: npm run build

      # UI audit + rig/clip verification + QC suite + wiki regeneration.
      - name: Test
        run: npm test

      # The Unity side, checked without Unity. Isoperia.Core is declared
      # noEngineReferences and the scene check reads the scene FILE, so all of
      # this runs here with no Editor and no licence — on every branch, not
      # just the ones that trigger a build.
      - name: Verify the Unity port
        run: |
          npm run verify:scene
          npm run verify:core
          npm run verify:parity
          npm run verify:json
          npm run verify:sanitizer
          npm run verify:content
          npm run verify:world
          npm run verify:shaders
          npm run verify:models
          npm run verify:separators
          npm run verify:pwa

      # The website composition, checked without Unity and without a deploy.
      # Moving the game off the site root breaks its _headers silently — the
      # build passes, the deploy passes, and the wasm goes out with no
      # Content-Encoding. verify:compose runs the real template's _headers
      # through the composer and asserts no root-anchored rule survives;
      # verify:deploy-report drives the header check against a live local
      # server serving both good and bad headers. Neither needs a licence.
      - name: Verify the website composition
        run: npm run verify:site

      # The generated files must match what is committed, or the wiki and the
      # manifest silently drift from the data they claim to describe.
      - name: Check generated files are up to date
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are stale. Run 'npm test' and commit the result."
            git diff --stat
            git diff
            exit 1
          fi

      - name: Smoke (boots the built game in Chromium)
        run: node scripts/smoke.cjs

      - name: Visual regression (opening frame)
        run: node scripts/visual-regress.cjs

      # Deep audit: cross-table data integrity, save round-trip, dead code and
      # assets, producer/consumer wiring. Quick mode — its browser passes overlap
      # with the smoke and visual steps above, and it fails only on BUG findings.
      - name: Audit
        run: npm run audit:quick

      # The rendered frame and any diff, so a failure is diagnosable without
      # reproducing it locally.
      - name: Upload frame artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames
          path: .visual/
          if-no-files-found: ignore
          retention-days: 14
